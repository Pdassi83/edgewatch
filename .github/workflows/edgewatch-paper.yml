name: EDGEWATCH paper trading
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edgewatch-paper-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recolher e verificar o laboratório privado
        env:
          EDGEWATCH_SITE_ORIGIN: ${{ secrets.EDGEWATCH_SITE_ORIGIN }}
          EDGEWATCH_SITE_TOKEN: ${{ secrets.EDGEWATCH_SITE_TOKEN }}
        run: node scripts/edgewatch-collect.mjs
